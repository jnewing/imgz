# imgz - local development datastore.
#
# This file runs ONLY the database in Docker. PHP + Node run on the host via
# `composer run dev` (which runs artisan serve + queue:listen + pail + vite).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d     # or: make dev-up
#   composer run dev                                    # or just: make dev
#
# The host app connects to the forwarded port on 127.0.0.1 (see .env:
# DB_HOST=127.0.0.1). Override the forwarded host port with DB_PORT_FORWARD.

services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-imgz}
            POSTGRES_USER: ${DB_USERNAME:-imgz}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-imgz}
        ports:
            - "${DB_PORT_FORWARD:-5432}:5432"
        volumes:
            - pgdata-dev:/var/lib/postgresql/data
            - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-imgz} -d ${DB_DATABASE:-imgz}"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata-dev:
