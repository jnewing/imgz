name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      # composer setup migrates the app db (imgz) on 5432; the test suite uses
      # imgz_testing on 5433 (see phpunit.xml). One postgres answers on both.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: imgz
          POSTGRES_USER: imgz
          POSTGRES_PASSWORD: imgz
        ports:
          - 5432:5432
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U imgz -d imgz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, gd, exif, intl, zip, redis, pcntl, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - name: Create the test database
        run: PGPASSWORD=imgz psql -h 127.0.0.1 -p 5432 -U imgz -d imgz -c 'CREATE DATABASE imgz_testing;'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
